function roleAvatar(role){const own=myAvatar();if(own.startsWith(role+'-'))return own;const shared=rows('頭貼設定').find(x=>x.data.role===role&&validAvatar(x.data.avatar).startsWith(role+'-'));return shared?.data.avatar||role+'-1'}function personAvatar(person){const roles=person==='老婆'?['female']:person==='老公'?['male']:['female','male'];return `<span class="cal-people" title="${person==='老婆'||person==='老公'?person:'共同'}">${roles.map(r=>`<img class="cal-avatar" src="${avatarSrc(roleAvatar(r))}" alt="${r==='female'?'老婆':'老公'}">`).join('')}</span>`}function filterAvatarRole(el){const picker=el.closest('.avatar-picker');picker.querySelectorAll('fieldset').forEach(f=>{const active=f.dataset.role===el.value;f.hidden=!active;f.querySelectorAll('input').forEach(i=>{i.disabled=!active;if(!active)i.checked=false})});}async function publishAvatar(v){if(!room||!cloud||!validAvatar(v))return;const role=v.split('-')[0];const old=rows('頭貼設定').find(x=>x.data.owner===user.id);await save('頭貼設定',{owner:user.id,role,avatar:v},old?.id)}const shiftTypes={'早':'早班','晚':'晚班','值':'值勤','休':'休假'};function shiftCode(d){if(d.shift==='')return '';return Object.keys(shiftTypes).find(k=>[k,shiftTypes[k]].includes(d.shift)||[k,shiftTypes[k]].includes(d.title)||[k,shiftTypes[k]].includes(d.time))||''}function shiftBadge(d){const k=shiftCode(d);return k?`<span class="shift-tag" data-shift="${k}" title="${shiftTypes[k]}">${k}</span>`:''}function allowedShifts(person){return person==='老公'?['休']:person==='共同'?[]:Object.keys(shiftTypes)}function filterShift(el){const form=el.form;form.querySelectorAll('.shift-choice').forEach(label=>{const input=label.querySelector('input');const show=!input.value||allowedShifts(el.value).includes(input.value);label.hidden=!show;input.disabled=!show;if(!show&&input.checked)form.querySelector('input[name="shift"][value=""]').checked=true})}function commonOff(date){const a=rows('共同班表').filter(x=>x.data.date===date&&shiftCode(x.data)==='休');return a.some(x=>x.data.person==='老婆')& function avatarSrc(v){return "assets/avatar-"+v+".jpg"}function validAvatar(v){return /^(male|female)-[1-6]$/.test(v||'')?v:''}function myAvatar(){return validAvatar(cloud?user?.user_metadata?.tangAvatar:localStorage.getItem('tang-avatar'))}function avatarLabel(v){return v.startsWith('male')?'老公・金毛':'老婆・小白'}function avatarImg(v){return validAvatar(v)?`<img class="profile-avatar" src="${avatarSrc(v)}" alt="${avatarLabel(v)}">`:''}function avatarPicker(v=''){return `<div class="avatar-picker"><h3>選擇你的專屬頭貼</h3><label>身分</label><select onchange="filterAvatarRole(this)"><option value="" ${!v?'selected':''}>請選擇身分（登入可略過）</option><option value="male" ${v.startsWith('male')?'selected':''}>老公・金毛</option><option value="female" ${v.startsWith('female')?'selected':''}>老婆・小白</option></select>${['male','female'].map(r=>`<fieldset data-role="${r}" ${v.startsWith(r)?'':'hidden'}><legend>${avatarLabel(r)}</legend><div class="avatar-grid">${Array.from({length:6},(_,i)=>{const a=r+'-'+(i+1);return `<label class="avatar-option"><img src="${avatarSrc(a)}" alt="${avatarLabel(a)} ${i+1}"><input type="radio" name="avatar" value="${a}" ${v.startsWith(r)?'':'disabled'} ${v===a?'checked':''}><small>${i+1}</small></label>`}).join('')}</div></fieldset>`).join('')}</div>`}async function saveAvatar(e){e.preventDefault();const v=validAvatar(new FormData(e.target).get('avatar'));if(!v)return alert('請選擇頭貼');try{if(cloud){const r=await sb.auth.updateUser({data:{tangAvatar:v}});if(r.error)throw r.error;user=r.data.user;await publishAvatar(v)}else localStorage.setItem('tang-avatar',v);render()}catch(e){err(e)}}function avatarSettings(){return `<div class="card"><form onsubmit="finishWelcome(event)"><label>暱稱</label><input name="nickname" required maxlength="30" value="${esc(nickname())}">${avatarPicker(myAvatar())}<button>儲存個人設定</button></form></div>`}function profileStrip(){const v=myAvatar();return v?`<div class="profile-strip">${avatarImg(v)}<div><b>${esc(nickname()||avatarLabel(v))}</b><small>${avatarLabel(v)}</small></div><button class="secondary" onclick="go('設定')">更換</button></div>`:''}

async function auth(e){e.preventDefault();let f=new FormData(e.target),a={email:f.get('email'),password:f.get('password')};try{const v=validAvatar(f.get('avatar'));let signup=e.submitter.value==='signup';if(signup&&!v)return alert('請先選擇頭貼');let r=signup?await sb.auth.signUp({...a,options:{data:{tangAvatar:v}}}):await sb.auth.signInWithPassword(a);if(r.error)throw r.error;if(!signup&&v&&r.data.session){const u=await sb.auth.updateUser({data:{tangAvatar:v}});if(u.error)throw u.error;}if(!r.data.session)alert('請先到信箱驗證，再登入');await connect();if(room&&myAvatar())await publishAvatar(myAvatar())}catch(e){err(e)}}async function pair(create){try{let r=await sb.rpc(create?'create_room':'join_room',create?{}:{code:$('code').value.trim()});if(r.error)throw r.error;await connect();if(myAvatar())await publishAvatar(myAvatar());go('首頁')}catch(e){err(e)}}async function logout(){await sb.auth.signOut();await connect();go('設定')}

const rewardDefaults=[[1, "抱抱券"], [2, "親親券"], [3, "幫忙跑腿一次"], [5, "飲料任選券"], [8, "按摩15分鐘"], [10, "家事免做券"], [12, "宵夜任選券"], [15, "睡到自然醒券"], [18, "專屬神秘盲盒"], [20, "美食大餐券"], [25, "半日自由時間券"], [30, "專屬浪漫約會"], [35, "心願小禮物"], [40, "一日約會行程任選"], [50, "願望實現券"]];const blindDefaults=['按摩15分鐘','甜點任選','免做家事一次','小禮物','神秘約會'];function rewardCatalog(){return rows('獎勵設定')[0]?.data||{items:rewardDefaults.map(([points,name])=>({points,name,blind:name.includes('盲盒')})),blind:blindDefaults}}function rewardSettings(){const c=rewardCatalog();return `<details class="card"><summary>15項預設獎勵・管理獎勵</summary><form onsubmit="saveRewards(event)"><p class="muted">每行格式：點數 | 獎勵名稱（盲盒名稱需包含盲盒）</p><textarea name="items" rows="15" required>${esc(c.items.map(x=>x.points+' | '+x.name).join('\n'))}</textarea><label>盲盒內容（每行一項）</label><textarea name="blind" rows="5" required>${esc(c.blind.join('\n'))}</textarea><button>儲存獎勵清單</button></form></details>`}function saveRewards(e){e.preventDefault();const d=new FormData(e.target),items=String(d.get('items')).split('\n').filter(x=>x.trim()).map(x=>{const [p,...n]=x.split('|');const name=n.join('|').trim();return {points:Number(p),name,blind:name.includes('盲盒')}}),blind=String(d.get('blind')).split('\n').map(x=>x.trim()).filter(Boolean);if(!items.length||!blind.length||items.some(x=>!Number.isInteger(x.points)||x.points<1||x.points>50||!x.name))return alert('請確認點數為1至50及獎勵名稱');save('獎勵設定',{items:items.sort((a,b)=>a.points-b.points),blind,date:today()},rows('獎勵設定')[0]?.id)}function chooseReward(el){if(el.value==='')return;const r=rewardCatalog().items[Number(el.value)],f=el.form;f.goal.value=r.points;f.reward.value=r.name}
function stampFullCard(x){const d=x.data,n=Number(d.points||0),goal=Number(d.goal),full=n>=goal;return `<article class="stampcard" data-stamp-id="${esc(x.id)}"><small>LOVE REWARD CARD · ${esc(d.person)}</small><h3>${esc(d.title)}</h3><p>${full?'已集滿！可以兌換或保留點數':'集滿後自由選擇獎勵'}</p><progress max="${goal}" value="${n}"></progress><b>${n} / ${goal} 點</b><div class="stamps">${Array.from({length:goal},(_,i)=>`<span class="stamp ${i<n?'filled':''}">${i<n?`<img alt="已集點" src="assets/stamp-${Number(d.stamp)||1}.png">`:i+1}</span>`).join('')}</div><div class="row"><button ${full?'disabled':''} onclick="stampChange('${x.id}',1)">＋ 集一點</button><button class="secondary" ${n===0?'disabled':''} onclick="stampChange('${x.id}',-1)">－ 扣一點</button><button ${!full?'disabled':''} onclick="redeem('${x.id}')">選擇兌換</button></div><p><small>已兌換 ${Number(d.redeemed||0)} 次</small></p><details><summary>兌換紀錄</summary>${(d.history||[]).map(h=>`<p>${esc(h.date)} · ${esc(h.reward)}${h.points?` · ${h.points} 點`: ''}</p>`).join('')||'<p>尚無紀錄</p>'}</details><button class="secondary" onclick="edit('${x.id}')">編輯</button> <button class="secondary" onclick="remove('${x.id}')">刪除</button></article>`}
function stampCompactCard(x){const d=x.data;return `<article class="card stamp-compact"><details><summary><span class="compact-name"><b>${esc(d.title)}</b><br><small>${esc(d.person)} · 已集滿</small></span><span class="compact-points">${Number(d.points)} 點</span><span aria-hidden="true">⌄</span></summary><div class="compact-detail">${stampFullCard(x)}</div></details><div class="compact-actions"><button onclick="redeem('${x.id}')">選擇兌換</button></div></article>`}
function stampUI(){return `<h2>♡ 夫妻集點卡</h2><p class="muted">把日常的小努力，換成大大的幸福。</p>${(()=>{const cards=rows('集點卡'),active=cards.filter(x=>Number(x.data.points||0)<Number(x.data.goal)),full=cards.filter(x=>Number(x.data.points||0)>=Number(x.data.goal));return `<h3 class="stamp-section-title">集點中 <small>${active.length} 張</small></h3>${active.map(stampFullCard).join('')||'<p class="muted">目前沒有集點中的卡片</p>'}<h3 class="stamp-section-title">已集滿・待兌換 <small>${full.length} 張</small></h3>${full.map(stampCompactCard).join('')||'<p class="muted">目前沒有待兌換的卡片</p>'}`})()}${rewardSettings()}<div class="card"><h3>${editing?'編輯集點卡':'建立新的集點卡'}</h3><form onsubmit="stampSubmit(event)">${field('title','卡片名稱',editing?.data.title||'')}<label>集點對象</label><select name="person" ${k==='共同班表'?'onchange="filterShift(this)"':''}>${['老婆','老公','共同'].map(v=>`<option ${editing?.data.person===v?'selected':''}>${v}</option>`).join('')}</select><label>印章款式</label><div class="stamp-picker">${[1,2,3].map(i=>`<label><input type="radio" name="stamp" value="${i}" ${(Number(editing?.data.stamp)||1)===i?'checked':''}><img src="assets/stamp-${i}.png" alt="印章 ${i}"></label>`).join('')}</div><label>集滿幾點（1–50）</label><input type="number" name="goal" min="1" max="50" required value="${editing?.data.goal||10}"><button>儲存集點卡</button>${editing?'<button type="button" onclick="editing=null;render()">取消</button>':''}</form></div>`}
function stampSubmit(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),old=editing?.data||{};d.goal=Number(d.goal);if(!Number.isInteger(d.goal)||d.goal<1||d.goal>50||d.goal<(old.points||0))return alert('目標需為1至50點，且不得低於現有點數');save('集點卡',{...old,...d,date:old.date||today(),points:old.points||0},editing?.id)}
async function stampChange(id,delta){let x=db.find(x=>x.id===id);if(!x||busy)return;const before=Number(x.data.points||0),goal=Number(x.data.goal),points=Math.max(0,Math.min(goal,before+delta));if(points===before)return;const ok=await save('集點卡',{...x.data,points},id);if(ok&&delta>0&&page==='集點卡'){await stampImpact(id,points-1,points===goal);if(points===goal&&page==='集點卡')redeem(id)}}
function stampImpact(id,index,full){const card=Array.from(document.querySelectorAll('.stampcard')).find(el=>el.dataset.stampId===String(id));const details=card?.closest('.stamp-compact details');if(details)details.open=true;const cell=card?.querySelectorAll('.stamp')[index];if(!cell||matchMedia('(prefers-reduced-motion: reduce)').matches)return Promise.resolve();cell.classList.add('stamp-impact');const rect=cell.getBoundingClientRect();const layer=document.createElement('div');layer.className='stamp-fx-layer';layer.setAttribute('aria-hidden','true');layer.style.left=(rect.left+rect.width/2)+'px';layer.style.top=(rect.top+rect.height/2)+'px';for(let i=0;i<(full?24:8);i++){const p=document.createElement('span'),a=i*2.39996,d=(full?65:25)+(i%4)*12;p.textContent=['♡','✦','♥','✧'][i%4];p.style.cssText=`--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--pc:${['#d97c98','#e7b44e','#91b584'][i%3]};`;layer.append(p)}document.body.append(layer);return new Promise(resolve=>setTimeout(()=>{layer.remove();cell.classList.remove('stamp-impact');resolve()},620))}
function redeem(id){const x=db.find(x=>x.id===id);if(!x||busy||Number(x.data.points)<Number(x.data.goal)||document.querySelector('.stamp-redeem-overlay'))return;const n=Number(x.data.points),items=rewardCatalog().items.slice();if(x.data.reward&&!items.some(r=>r.name===x.data.reward))items.push({name:x.data.reward,points:Number(x.data.goal),blind:x.data.reward.includes('盲盒')});items.sort((a,b)=>a.points-b.points);const overlay=document.createElement('div');overlay.className='reward-overlay stamp-redeem-overlay';overlay.innerHTML=`<section class="reward-card stamp-redeem-card" role="dialog" aria-modal="true" aria-label="選擇兌換獎勵"><h2>集點完成！</h2><p>目前有 ${n} 點 · 選擇喜歡的獎勵</p><div class="stamp-reward-list">${items.map((r,i)=>`<button class="secondary" data-index="${i}" ${r.points>n?'disabled':''}><span>${esc(r.name)}</span><b>${r.points} 點${r.points>n?' · 點數不足':''}</b></button>`).join('')}</div><button class="secondary keep-points">保留點數，晚點再兌換</button></section>`;const prev=document.activeElement,overflow=document.body.style.overflow;function close(){overlay.remove();document.body.style.overflow=overflow;document.removeEventListener('keydown',key);if(prev?.isConnected)prev.focus()}function key(e){if(e.key==='Escape')close();if(e.key==='Tab'){const a=[...overlay.querySelectorAll('button:not(:disabled)')];e.preventDefault();a[(a.indexOf(document.activeElement)+(e.shiftKey?-1:1)+a.length)%a.length]?.focus()}}overlay.querySelector('.keep-points').onclick=close;overlay.querySelectorAll('[data-index]').forEach(btn=>btn.onclick=async()=>{const r=items[Number(btn.dataset.index)],current=db.find(y=>y.id===id);if(busy||!current||Number(current.data.points)<r.points||Number(current.data.points)<Number(current.data.goal))return alert('點數已變更，請重新開啟兌換');if(!confirm(`確定使用 ${r.points} 點兌換 ${r.name}？`))return;const pool=rewardCatalog().blind;if(r.blind&&!pool.length)return alert('請先設定盲盒內容');const result=r.blind?pool[Math.floor(Math.random()*pool.length)]:r.name;const ok=await save('集點卡',{...current.data,points:Number(current.data.points)-r.points,redeemed:Number(current.data.redeemed||0)+1,history:[{date:today(),reward:r.blind?r.name+'：'+result:result,points:r.points},...(current.data.history||[])]},id);if(ok){close();if(r.blind){showWheelReward(result,1,'神秘盲盒');document.querySelector('.reward-actions button:last-child')?.remove()}}});document.body.append(overlay);document.body.style.overflow='hidden';document.addEventListener('keydown',key);overlay.querySelector('.keep-points').focus()}
