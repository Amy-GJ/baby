'stats'?'list':'stats';render()">${finView==='stats'?'收支明細':'統計分析'}</button></div>`;let h=`<section class="card fin"><h2>家庭帳本 ♡</h2>${tabs}<div class="fin-tabs">${['月','近6個月','年','自訂'].map(t=>`<button class="${finPeriod===t?'chosen':'secondary'}" onclick="finPeriod='${t}';render()">${t}</button>`).join('')}</div><div class="fin-date"><button onclick="finMonthShift(finPeriod==='年'?-12:-1)">‹</button><b>${finPeriod==='年'?month.slice(0,4)+' 年':month.replace('-',' 年 ')+' 月'}</b><button onclick="finMonthShift(finPeriod==='年'?12:1)">›</button></div>${finPeriod==='自訂'?`<input type="date" value="${finFrom}" onchange="finFrom=this.value;render()"><input type="date" value="${finTo}" onchange="finTo=this.value;render()">`:''}<div class="fin-summary"><span>收入<br><b>${money(inc)}</b></span><span>支出<br><b>${money(out)}</b></span><span>結餘<br><b>${money(inc-out)}</b></span></div>`;if(finView==='stats'){const groups=new Map();for(const x of a.filter(x=>finStat==='結餘'||(x.data.type||'支出')===finStat)){const k=finStat==='結餘'?(x.data.type||'支出'):(x.data.category||x.data.title||'其他');groups.set(k,(groups.get(k)||0)+(Number(x.data.amount)||0))}const total=[...groups.values()].reduce((s,n)=>s+n,0),colors=['#d89ba9','#e7bf9a','#a9b9a1','#b5adce','#91b7cb','#e5cf85'];let offset=0;const parts=[...groups].map(([k,n],i)=>{const p=total?n/total*100:0,c=colors[i%colors.length],o=offset;offset+=p;return {k,n,p,c,o}});h+=`<div class="fin-tabs">${['支出','收入','結餘'].map(t=>`<button class="${finStat===t?'chosen':'secondary'}" onclick="finStat='${t}';render()">${t}</button>`).join('')}</div><svg viewBox="0 0 240 240" class="fin-chart"><circle cx="120" cy="120" r="88" fill="none" stroke="#eee0da" stroke-width="34"/>${parts.map(p=>`<circle cx="120" cy="120" r="88" fill="none" stroke="${p.c}" stroke-width="34" pathLength="100" stroke-dasharray="${p.p} ${100-p.p}" stroke-dashoffset="${-p.o}" transform="rotate(-90 120 120)"/>`).join('')}<text x="120" y="110" text-anchor="middle" fill="#795c54">${finStat}</text><text x="120" y="135" text-anchor="middle" fill="#795c54" font-size="15">${money(finStat==='結餘'?inc-out:total)}</text></svg>${parts.map(p=>`<div class="fin-line"><i style="background:${p.c}"></i>${esc(p.k)}<small>${p.p.toFixed(1)}%</small><b>${money(p.n)}</b></div>`).join('')}`}return h+`<h3>收支明細</h3>${a.map(x=>`<div class="entry"><div><b>${esc(x.data.category||x.data.title)}</b><br><small>${esc(x.data.date)} · ${esc(x.data.note||'')}</small><br>${x.data.type==='收入'?'+':'−'} ${money(Number(x.data.amount)||0)}</div><button class="secondary" onclick="finStart('${x.id}')">修改</button><button class="secondary" onclick="remove('${x.id}')">刪除</button></div>`).join('')||'<div class="fin-empty"><b>♡</b>尚無收支紀錄<br>從第一筆生活小記開始</div>'}</section>`}

function annUI(){const a=annOrdered(),x=a.find(x=>x.id===annId);if(annForm){const d=editing?.data||{};return `<section class="card ann-form"><h2>${editing?'修改':'新增'}紀念日</h2><form onsubmit="annSave(event)">${field('title','紀念日名稱',d.title)}${field('date','起始日期',d.date||today(),'date')}${field('symbol','圖示（例如 ♡、💍）',d.symbol||'♡')}<label>時間顯示</label><select name="mode"><option ${d.mode!=='年月日'?'selected':''}>天數</option><option ${d.mode==='年月日'?'selected':''}>年月日</option></select><label>封面照片</label><label class="photo-upload">＋ 新增／更換照片<input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)"></label><img id="photoPreview" class="baby-preview" ${d.photo?'src="'+esc(d.photo)+'"':'hidden'}>${d.photo?'<label><input type="checkbox" name="clearPhoto"> 移除封面</label>':''}<label>紀念日故事</label><textarea name="note">${esc(d.note||'')}</textarea><button>儲存紀念日</button><button type="button" class="secondary" onclick="annClose()">取消</button></form></section>`}if(x){const d=x.data,n=annDiff(d.date,today()),events=[{date:today(),label:'今天'},{date:d.date,label:'紀念日起始日'}];for(let i=Math.max(1,Math.floor(n/100)-1);i<=Math.max(5,Math.floor(n/100)+5);i++)events.push({date:annAdd(d.date,i*100),label:i*100+' 天'});for(let i=Math.max(1,Math.floor(n/365)-1);i<=Math.max(3,Math.floor(n/365)+3);i++)events.push({date:annMonth(d.date,i*12),label:i+' 週年'});events.sort((a,b)=>a.date.localeCompare(b.date));const next=events.find(v=>v.date>today());return `<button class="secondary" onclick="annOpen(null)">‹ 所有紀念日</button><div class="ann-hero">${annPhoto(d)}<div class="ann-shade"></div><div class="ann-top"><b>${esc(d.symbol||'♡')} ${esc(d.title)}</b><small>${annDate(d.date)}</small></div><strong>${annLabel(d)}</strong></div><section class="ann-sheet"><div class="ann-actions"><button onclick="annEdit('${x.id}')">修改／故事</button><button class="secondary" onclick="remove('${x.id}')">刪除</button></div>${d.note?`<p class="ann-story">${esc(d.note)}</p>`:''}${events.map(v=>`<div class="ann-event ${ async function compressPhoto(file){if(file.size>25*1024*1024)throw Error('請選擇 25 MB 以下照片');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');const scale=Math.min(1,1200/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let q=.82,out=c.toDataURL('image/jpeg',q);while(out.length>850000&&q>.2){q-=.1;out=c.toDataURL('image/jpeg',q)}if(out.length>850000)throw Error('照片過大，請選擇較小照片');return out}finally{URL.revokeObjectURL(url)}}
async function previewPhoto(input){const el=document.getElementById('photoPreview');if(!input.files[0])return;try{const src=await compressPhoto(input.files[0]);if(el.isConnected){el.src=src;el.hidden=false}}catch(e){input.value='';alert('無法讀取照片，請使用 JPG、PNG 或 WebP。 '+e.message)}}

function missSenderAvatar(d,own){const shared=d.senderId&&rows('頭貼設定').find(x=>x.data.owner===d.senderId&&validAvatar(x.data.avatar));const role=['male','female'].includes(d.senderRole)?d.senderRole:'';const v=(own&&myAvatar())||shared?.data.avatar||validAvatar(d.senderAvatar)||(role&&roleAvatar(role));return validAvatar(v)?`<img class="miss-sender-avatar" src="${avatarSrc(v)}" alt="傳送者頭貼">`:`<span class="miss-sender-avatar miss-unknown" aria-label="未知傳送者">♡</span>`}function roleAvatar(role){const own=myAvatar();if(own.startsWith(role+'-'))return own;const shared=rows('頭貼設定').find(x=>x.data.role===role&&validAvatar(x.data.avatar).startsWith(role+'-'));return shared?.data.avatar||role+'-1'}function personAvatar(person){const roles=person==='老婆'?['female']:person==='老公'?['male']:['female','male'];return `<span class="cal-people" title="${person==='老婆'||person==='老公'?person:'共同'}">${roles.map(r=>`<img class="cal-avatar" src="${avatarSrc(roleAvatar(r))}" alt="${r==='female'?'老婆':'老公'}">`).join('')}</span>`}function filterAvatarRole(el){const picker=el.closest('.avatar-picker');picker.querySelectorAll('fieldset').forEach(f=>{const active=f.dataset.role===el.value;f.hidden=!active;f.querySelectorAll('input').forEach(i=>{i.disabled=!active;if(!active)i.checked=false})});}async function publishAvatar(v){if(!room||!cloud||!validAvatar(v))return;const role=v.split('-')[0];const old=rows('頭貼設定').find(x=>x.data.owner===user.id);await save('頭貼設定',{owner:user.id,role,avatar:v},old?.id)}const shiftTypes={'早':'早班','晚':'晚班','值':'值勤','休':'休假'};function shiftCode(d){if(d.shift==='')return '';return Object.keys(shiftTypes).find(k=>[k,shiftTypes[k]].includes(d.shift)||[k,shiftTypes[k]].includes(d.title)||[k,shiftTypes[k]].includes(d.time))||''}function shiftBadge(d){const k=shiftCode(d);return k?`<span class="shift-tag" data-shift="${k}" title="${shiftTypes[k]}">${k}</span>`:''}function allowedShifts(person){return person==='老公'?['休']:person==='共同'?[]:Object.keys(shiftTypes)}function fi function calendar(){let y=month.getFullYear(),m=month.getMonth(),n=new Date(y,m+1,0).getDate(),offset=new Date(y,m,1).getDay();return `<div class="card calendar-card60"><div class="row"><button onclick="shift(-1)">‹</button><b style="text-align:center">${y} 年 ${m+1} 月</b><button onclick="shift(1)">›</button></div><div class="calendar">${'日一二三四五六'.split('').map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:n},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="${batchMode?(batchDates.has(d)?'batch-selected':''):d===selected?'sel':''} ${commonOff(d)?'common-off':''}" aria-pressed="${batchMode?batchDates.has(d):d===selected}" onclick="batchDay('${d}')">${i+1}${batchMode&&batchDates.has(d)?'<span class="batch-tick">✓</span>':''}${commonOff(d)?'<span class="common-off-label">♡ 共休</span>':''}<i>${rows('共同班表').filter(x=>x.data.date===d&&!(commonOff(d)&&shiftCode(x.data)==='休'&&['老婆','老公'].includes(x.data.person))).sort((a,b)=>['老婆','老公','共同'].indexOf(a.data.person)-['老婆','老公','共同'].indexOf(b.data.person)).map(x=>`<span class="shift-line">${personAvatar(x.data.person)}${shiftBadge(x.data)}</span>`).join('')}</i></button>`}).join('')}</div>${batchToolbar()}${commonOff(selected)?'<div class="calendar-off-note"><span class="common-off-label">♡ 夫妻共同休假</span></div>':''}</div>`}function shift(n){if(batchWorking)return;month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
