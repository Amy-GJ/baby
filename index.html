function finStart(id){const d=db.find(x=>x.id===id)?.data||{};finId=id||null;finType=d.type==='收入'?'收入':'支出';finCat=d.category||d.title||finDefaults[finType][0][0];finExpr=String(d.amount||'');finNote=d.note||(!d.category?d.title||'':'');finDate=d.date||today();finView='input';render()}
function finCalc(s){if(!/^\d+(?:\.\d*)?(?:[+*/-]\d+(?:\.\d*)?)*$/.test(s))return NaN;const t=s.match(/\d+(?:\.\d*)?|[+*/-]/g),a=[Number(t[0])],ops=[];for(let i=1;i<t.length;i+=2){const n=Number(t[i+1]);if(t[i]==='*')a[a.length-1]*=n;else if(t[i]==='/')a[a.length-1]/=n;else{ops.push(t[i]);a.push(n)}}return a.reduce((v,n,i)=>i?v+(ops[i-1]==='-'?-n:n):n,0)}
function finKey(k){if(k==='AC')finExpr='';else if(k==='←')finExpr=finExpr.slice(0,-1);else if(finExpr.length<40)finExpr+=k;document.getElementById('finAmount').textContent='NT$ '+(finExpr||'0')}
async function finSave(){const n=finCalc(finExpr);if(!Number.isFinite(n)||n<=0||n>1e10)return alert('請輸入有效金額');if(!finDate)return alert('請選日期');const old=db.find(x=>x.id===finId)?.data||{};if(await save(finKind,{...old,title:finCat,category:finCat,amount:Math.round(n*100)/100,type:finType,note:finNote,date:finDate},finId)){finView='list';render()}}
async function finAddCat(){const t=prompt('新增分類名稱')?.trim();if(t&&!finCats().some(x=>x[0]===t)){finCat=t;await save('帳本分類',{title:t,type:finType,date:today()})}}
function finShift(n){finDate=annAdd(finDate,n);render()}
function finMonthShift(n){finMonth=annMonth((finMonth||today().slice(0,7))+'-01',n).slice(0,7);render()}
function finUI(){const all=rows(finKind),money=n=>'NT$ '+n.toLocaleString('zh-TW',{maximumFractionDigits:2}),sum=a=>a.reduce((s,x)=>s+(Number(x.data.amount)||0),0);if(finView==='input'){const cats=finCats();if(!cats.some(x=>x[0]===finCat))cats.push([finCat,'◇']);return `<section class="card fin"><div class="fin-tabs">${['支出','收入'].map(t=>`<button class="${finType===t?'chosen':'secondary'}" onclick="finType='${t}';finCat=finDefaults[finType][0][0];render()">${t}</button>`).join('')}</div><div class="fin-cats"><button onclick="finAddCat()"><b>＋</b>新增分類</button>${cats.map(([t,i])=>`<button class="${t===finCat?'chosen':''}" data-cat="${esc(t)}" onclick="finCat=this.dataset.cat;render()"><b>${i}</b>${esc(t)}</button>`).join('')}</div><h2 id="finAmount">NT$ ${esc(finExpr||'0')}</h2><small>${esc(finCat)}</small><input placeholder="輸入備註" value="${esc(finNote)}" oninput="finNote=this.value"><div class="fin-pad"><div class="fin-date"><button onclick="finShift(-1)">‹</button><input type="date" value="${esc(finDate)}" onchange="finDate=this.value"><button onclick="finShift(1)">›</button></div><div class="fin-keys">${['7','8','9','/','AC','4','5','6','*','←','1','2','3','+','OK','00','0','.','-'].map(k=>`<button class="${k==='OK'?'fin-ok':['/','*','+','-','AC','←'].includes(k)?'fin-op':''}" onclick="${k==='OK'?'finSave()':`finKey('${k}')`}">${k==='/'?'÷':k==='*'?'×':k}</button>`).join('')}</div></div><button class="secondary" onclick="finView='list';render()">取消</button></section>`}const month=finMonth||today().slice(0,7),a=all.filter(x=>{const d=x.data.date||'';return finPeriod==='年'?d.startsWith(month.slice(0,4)):finPeriod==='近6個月'?d>=annMonth(month+'-01',-5)&&d<annMonth(month+'-01',1):finPeriod==='自訂'?(!finFrom||d>=finFrom)&&(!finTo||d<=finTo):d.startsWith(month)}),inc=sum(a.filter(x=>x.data.type==='收入')),out=sum(a.filter(x=>x.data.type!=='收入'));const tabs=`<div class="fin-actions"><button onclick="finStart()">＋ 記帳</button><button class="secondary" onclick="finView=finView==='stats'?'list':'stats';render()">${finView==='stats'?'收支明細':'統計分析'}</button></div>`;let h=`<section class="card fin"><h2>家庭帳本 ♡</h2>${tabs}<div class="fin-tabs">${['月','近6個月','年','自訂'].map(t=>`<button class="${finPeriod===t?'chosen':'secondary'}" onclick="finPeriod='${t}';render()">${t}</button>`).join('')}</div><div class="fin-date"><button onclick="finMonthShift(finPeriod==='年'?-12:-1)">‹</button><b>${finPeriod==='年'?month.slice(0,4)+' 年':month.replace('-',' 年 ')+' 月'}</b><button onclick="finMonthShift(finPeriod==='年'?12:1)">›</button></div>${finPeriod==='自訂'?`<input type="date" value="${finFrom}" onchange="finFrom=this.value;render()"><input type="date" value="${finTo}" onchange="finTo=this.value;render()">`:''}<div class="fin-summary"><span>收入<br><b>${money(inc)}</b></span><span>支出<br><b>${money(out)}</b></span><span>結餘<br><b>${money(inc-out)}</b></span></div>`;if(finView==='stats'){const groups=new Map();for(const x of a.filter(x=>finStat==='結餘'||(x.data.type||'支出')===finStat)){const k=finStat==='結餘'?(x.data.type||'支出'):(x.data.category||x.data.title||'其他');groups.set(k,(groups.get(k)||0)+(Number(x.data.amount)||0))}const total=[...groups.values()].reduce((s,n)=>s+n,0),colors=['#d89ba9','#e7bf9a','#a9b9a1','#b5adce','#91b7cb','#e5cf85'];let offset=0;const parts=[...groups].map(([k,n],i)=>{const p=total?n/total*100:0,c=colors[i%colors.length],o=offset;offset+=p;return {k,n,p,c,o}});h+=`<div class="fin-tabs">${['支出','收入','結餘'].map(t=>`<button class="${finStat===t?'chosen':'secondary'}" onclick="finStat='${t}';render()">${t}</button>`).join('')}</div><svg viewBox="0 0 240 240" class="fin-chart"><circle cx="120" cy="120" r="88" fill="none" stroke="#eee0da" stroke-width="34"/>${parts.map(p=>`<circle cx="120" cy="120" r="88" fill="none" stroke="${p.c}" stroke-width="34" pathLength="100" stroke-dasharray="${p.p} ${100-p.p}" stroke-dashoffset="${-p.o}" transform="rotate(-90 120 120)"/>`).join('')}<text x="120" y="110" text-anchor="middle" fill="#795c54">${finStat}</text><text x="120" y="135" text-anchor="middle" fill="#795c54" font-size="15">${money(finStat==='結餘'?inc-out:total)}</text></svg>${parts.map(p=>`<div class="fin-line"><i style="background:${p.c}"></i>${esc(p.k)}<small>${p.p.toFixed(1)}%</small><b>${money(p.n)}</b></div>`).join('')}`}return h+`<h3>收支明細</h3>${a.map(x=>`<div class="entry"><div><b>${esc(x.data.category||x.data.title)}</b><br><small>${esc(x.data.date)} · ${esc(x.data.note||'')}</small><br>${x.data.type==='收入'?'+':'−'} ${money(Number(x.data.amount)||0)}</div><button class="secondary" onclick="finStart('${x.id}')">修改</button><button class="secondary" onclick="remove('${x.id}')">刪除</button></div>`).join('')||'<div class="fin-empty"><b>♡</b>尚無收支紀錄<br>從第一筆生活小記開始</div>'}</section>`}

function annUI(){const a=annOrdered(),x=a.find(x=>x.id===annId);if(annForm){const d=editing?.data||{};return `<section class="card ann-form"><h2>${editing?'修改':'新增'}紀念日</h2><form onsubmit="annSave(event)">${field('title','紀念日名稱',d.title)}${field('date','起始日期',d.date||today(),'date')}${field('symbol','圖示（例如 ♡、💍）',d.symbol||'♡')}<label>時間顯示</label><select name="mode"><option ${d.mode!=='年月日'?'selected':''}>天數</option><option ${d.mode==='年月日'?'selected':''}>年月日</option></select><label>封面照片</label><input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)"><img id="photoPreview" class="baby-preview" ${d.photo?'src="'+esc(d.photo)+'"':'hidden'}>${d.photo?'<label><input type="checkbox" name="clearPhoto"> 移除封面</label>':''}<label>紀念日故事</label><textarea name="note">${esc(d.note||'')}</textarea><button>儲存紀念日</button><button type="button" class="secondary" onclick="annClose()">取消</button></form></section>`}if(x){const d=x.data,n=annDiff(d.date,today()),events=[{date:today(),label:'今天'},{date:d.date,label:'紀念日起始日'}];for(let i=Math.max(1,Math.floor(n/100)-1);i<=Math.max(5,Math.floor(n/100)+5);i++)events.push({date:annAdd(d.date,i*100),label:i*100+' 天'});for(let i=Math.max(1,Math.floor(n/365)-1);i<=Math.max(3,Math.floor(n/365)+3);i++)events.push({date:annMonth(d.date,i*12),label:i+' 週年'});events.sort((a,b)=>a.date.localeCompare(b.date));const next=events.find(v=>v.date>today());return `<button class="secondary" onclick="annOpen(null)">‹ 所有紀念日</button><div class="ann-hero">${annPhoto(d)}<div class="ann-shade"></div><div class="ann-top"><b>${esc(d.symbol||'♡')} ${esc(d.title)}</b><small>${annDate(d.date)}</small></div><strong>${annLabel(d)}</strong></div><section class="ann-sheet"><div class="ann-actions"><button onclick="annEdit('${x.id}')">修改／故事</button><button class="secondary" onclick="remove('${x.id}')">刪除</button></div>${d.note?`<p class="ann-story">${esc(d.note)}</p>`:''}${events.map(v=>`<div class="ann-event ${v===next?'ann-next':''}"><b>${esc(v.label)} ${v===next?'♡':''}</b><small>${annDate(v.date)}</small></div>`).join('')}<button onclick="annEdit(null)">＋ 添加紀念日</button></section>`}return `<div class="ann-heading"><div><small>OUR SPECIAL DAYS</small><h2>紀念日 ♡</h2></div><button onclick="annEdit(null)">＋ 新增</button></div><div class="ann-grid">${a.map(x=>`<button class="ann-tile" data-id="${x.id}" onclick="if(Date.now()>annSuppress)annOpen('${x.id}')">${annPhoto(x.data)}<span class="ann-shade"></span><span class="ann-top"><b>${esc(x.data.symbol||'♡')} ${esc(x.data.title)}</b><small>${annDate(x.data.date)}</small></span><strong>${annLabel(x.data)}</strong></button>`).join('')}</div>${a.length?'':'<div class="card">還沒有紀念日，新增第一個值得收藏的日子吧。</div>'}<button class="ann-plus" aria-label="新增紀念日" onclick="annEdit(null)">＋</button>`}

function field(name,label,value='',type='text'){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${name==='title'||name==='date'?'required':''}>`}
function entryForm(k){let d=editing?.data||{},f=defs[k];if(!f)return '';return `<div class="card"><form onsubmit="submitEntry(event)">${k==='共同班表'?shiftPicker(d)+`<label>行程名稱（選班別可留空）</label><input name="title" value="${esc(d.title||'')}" placeholder="例如：約會、看診">`:field('title',f[0],d.title)}${field('date','日期',d.date||(k==='共同班表'?selected:today()),'date')}${f.includes('成員')?`<label>成員</label><select name="person" ${k==='共同班表'?'onchange="filterShift(this)"':''}>${['老婆','老公','共同'].map(v=>`<option ${d.person===v?'selected':''}>${v}</option>`).join('')}</select>`:''}${f.includes('時間')?field('time','時間／備註',d.time):''}${f.includes('金額')?field('amount','金額',d.amount,'number')+'<select name="type"><option>支出</option><option '+(d.type==='收入'?'selected':'')+'>收入</option></select>':''}${f.includes('備註')?field('note','備註',d.note):''}${f.includes('照片')?`<label>照片（選取後自動壓縮）</label><input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)"><img id="photoPreview" class="baby-preview" ${d.photo&&/^data:image\/(png|jpeg|webp|gif);base64,/.test(d.photo)?'src="'+esc(d.photo)+'"':'hidden'}>${d.photo?'<label><input type="checkbox" name="clearPhoto" value="yes"> 移除原照片</label>':''}`:''}<button>${editing?'儲存修改':'＋ 新增紀錄'}</button>${editing?'<button type="button" class="secondary" onclick="editing=null;render()">取消</button>':''}</form></div>`}
async function compressPhoto(file){if(file.size>25*1024*1024)throw Error('請選擇 25 MB 以下照片');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');const scale=Math.min(1,1200/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let q=.82,out=c.toDataURL('image/jpeg',q);while(out.length>850000&&q>.2){q-=.1;out=c.toDataURL('image/jpeg',q)}if(out.length>850000)throw Error('照片過大，請選擇較小照片');return out}finally{URL.revokeObjectURL(url)}}
async function previewPhoto(input){const el=document.getElementById('photoPreview');if(!input.files[0])return;try{const src=await compressPhoto(input.files[0]);if(el.isConnected){el.src=src;el.hidden=false}}catch(e){input.value='';alert('無法讀取照片，請使用 JPG、PNG 或 WebP。 '+e.message)}}
async function submitEntry(e){e.preventDefault();try{const f=new FormData(e.target),d={...(editing?.data||{})};for(const [k,v] of f)if(typeof v==='string'&&k!=='clearPhoto')d[k]=v;if(f.get('clearPhoto'))delete d.photo;const photo=f.get('photo');if(photo?.size)d.photo=await compressPhoto(photo);if(page==='共同班表'){if(d.shift&&!allowedShifts(d.person).includes(d.shift))return alert('請選擇符合成員的班別');if(d.shift){if(!d.title.trim()||Object.keys(shiftTypes).some(k=>[k,shiftTypes[k]].includes(d.title)))d.title=shiftTypes[d.shift];}else if(!d.title.trim())return alert('請選擇班別或輸入行程名稱');}if(page==='家庭帳本'&&!(Number(d.amount)>0))return alert('請輸入正數金額');await save(page==='小湯圓專區'&&tangTab==='寶寶照片'?'寶寶專區':page,d,editing?.id)}catch(e){err(e)}}

function coupleRows(){const saved=rows(coupleKind), map=new Map(saved.filter(x=>Number.isInteger(x.data.coupleDefault)).map(x=>[x.data.coupleDefault,x]));return coupleDefaults.map((title,i)=>map.get(i)||{id:'default-'+i,kind:coupleKind,data:{title,done:false,coupleDefault:i}}).concat(saved.filter(x=>!Number.isInteger(x.data.coupleDefault)||x.data.coupleDefault<0||x.data.coupleDefault>=100));}
async function coupleWrite(id,change){if(busy)return;const x=coupleRows().find(x=>x.id===id);if(!x)return;const data={...x.data,...change};if(!id.startsWith('default-'))return save(coupleKind,data,id);if(!cloud){return save(coupleKind,data)}busy=true;try{if(!room)throw Error('請先配對');const key=room.slice(0,24)+'100000000'+String(data.coupleDefault).padStart(3,'0');const r=await sb.from('entries').upsert({id:key,room_id:room,kind:coupleKind,data},{onConflict:'id'});if(r.error)throw r.error;await refresh()}catch(e){err(e)}finally{busy=false}}
function coupleToggle(id){const x=coupleRows().find(x=>x.id===id);if(x)coupleWrite(id,{done:!x.data.done})}
function coupleEdit(id){const x=coupleRows().find(x=>x.id===id);if(!x)return;const title=prompt('修改想一起完成的事',x.data.title);if(title!==null&&title.trim())coupleWrite(id,{title:title.trim()})}

function coupleUI(){const a=coupleRows(), pending=a.filter(x=>!x.data.done), done=a.filter(x=>x.data.done), pct=Math.round(done.length/a.length*100);const row=x=>`<div class="couple-row ${x.data.done?'is-done':''}"><button class="couple-check" aria-label="${x.data.done?'取消完成':'標記完成'}" aria-pressed="${!!x.data.done}" onclick="coupleToggle('${x.id}')">${x.data.done?'✓':''}</button><span>${esc(x.data.title)}</span><button class="couple-edit secondary" onclick="coupleEdit('${x.id}')" aria-label="修改事項">修改</button></div>`;return `<h2>夫妻100件事</h2><section class="card couple-progress"><small>OUR LITTLE BUCKET LIST</small><h3>一起收藏幸福的每一刻 ♡</h3><div class="couple-count"><strong>${done.length} / ${a.length}</strong><b>${pct}%</b></div><div class="couple-track"><div style="width:${pct}%"></div></div><button onclick="coupleAdd()">＋ 新增事項</button></section><section class="card couple-list"><h3>還沒完成 · ${pending.length} 件</h3>${pending.map(row).join('')||'<small>全部完成啦！</small>'}</section><section class="card couple-list"><h3>已完成 · ${done.length} 件</h3>${done.map(row).join('')||'<small>完成的幸福回憶會出現在這裡。</small>'}</section>`}

function roleAvatar(role){const own=myAvatar();if(own.startsWith(role+'-'))return own;const shared=rows('頭貼設定').find(x=>x.data.role===role&&validAvatar(x.data.avatar).startsWith(role+'-'));return shared?.data.avatar||role+'-1'}function personAvatar(person){const roles=person==='老婆'?['female']:person==='老公'?['male']:['female','male'];return `<span class="cal-people" title="${person==='老婆'||person==='老公'?person:'共同'}">${roles.map(r=>`<img class="cal-avatar" src="${avatarSrc(roleAvatar(r))}" alt="${r==='female'?'老婆':'老公'}">`).join('')}</span>`}function filterAvatarRole(el){const picker=el.closest('.avatar-picker');picker.querySelectorAll('fieldset').forEach(f=>{const active=f.dataset.role===el.value;f.hidden=!active;f.querySelectorAll('input').forEach(i=>{i.disabled=!active;if(!active)i.checked=false})});}async function publishAvatar(v){if(!room||!cloud||!validAvatar(v))return;const role=v.split('-')[0];const old=rows('頭貼設定').find(x=>x.data.owner===user.id);await save('頭貼設定',{owner:user.id,role,avatar:v},old?.id)}const shiftTypes={'早':'早班','晚':'晚班','值':'值勤','休':'休假'};function shiftCode(d){if(d.shift==='')return '';return Object.keys(shiftTypes).find(k=>[k,shiftTypes[k]].includes(d.shift)||[k,shiftTypes[k]].includes(d.title)||[k,shiftTypes[k]].includes(d.time))||''}function shiftBadge(d){const k=shiftCode(d);return k?`<span class="shift-tag" data-shift="${k}" title="${shiftTypes[k]}">${k}</span>`:''}function allowedShifts(person){return person==='老公'?['休']:person==='共同'?[]:Object.keys(shiftTypes)}function filterShift(el){const form=el.form;form.querySelectorAll('.shift-choice').forEach(label=>{const input=label.querySelector('input');const show=!input.value||allowedShifts(el.value).includes(input.value);label.hidden=!show;input.disabled=!show;if(!show&&input.checked)form.querySelector('input[name="shift"][value=""]').checked=true})}function commonOff(date){const a=rows('共同班表').filter(x=>x.data.date===date&&shiftCode(x.data)==='休');return a.some(x=>x.data.person==='老婆')& function showWheelReward(task,num,category){const previous=document.activeElement,overlay=document.createElement('div');overlay.className='reward-overlay';overlay.innerHTML=`<section class="reward-card" role="dialog" aria-modal="true" aria-labelledby="reward-title"><img src="assets/dog-3.png" alt="小狗歡呼"><small>LUCKY MOMENT · 第 ${num} 項</small><p></p><h2 id="reward-title"></h2><div class="reward-actions"><button class="secondary" type="button">關閉</button><button type="button">再轉一次</button></div></section>`;overlay.querySelector('p').textContent=category+' · 驚喜揭曉！';overlay.querySelector('h2').textContent=task;const buttons=overlay.querySelectorAll('button');function close(){overlay.remove();document.removeEventListener('keydown',key);document.body.style.overflow=oldOverflow;if(previous?.isConnected)previous.focus()}function key(e){if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();(document.activeElement===buttons[0]?buttons[1]:buttons[0]).focus()}}const oldOverflow=document.body.style.overflow;document.body.style.overflow='hidden';buttons[0].onclick=close;buttons[1].onclick=()=>{close();if(page==='遊戲轉盤')spin()};overlay.onclick=e=>{if(e.target===overlay)close()};for(let j=0;j<44;j++){const p=document.createElement('span'),t=j*Math.PI*2/44,d=130+Math.random()*220;p.className='reward-particle';p.setAttribute('aria-hidden','true');p.textContent=['♥','✦','▪','●'][j%4];p.style.cssText=`--x:${Math.cos(t)*d}px;--y:${Math.sin(t)*d}px;--r:${j*39}deg;--delay:${j%5*25}ms;--c:${['#e88b9e','#f4ce70','#a7c4a0','#e6a88b'][j%4]}`;overlay.append(p)}document.body.append(overlay);document.addEventListener('keydown',key);buttons[0].focus()}

function stampFullCard(x){const d=x.data,n=Number(d.points||0),goal=Number(d.goal),full=n>=goal;return `<article class="stampcard" data-stamp-id="${esc(x.id)}"><small>LOVE REWARD CARD · ${esc(d.person)}</small><h3>${esc(d.title)}</h3><p>${full?'已集滿！可以兌換或保留點數':'集滿後自由選擇獎勵'}</p><progress max="${goal}" value="${n}"></progress><b>${n} / ${goal} 點</b><div class="stamps">${Array.from({length:goal},(_,i)=>`<span class="stamp ${i<n?'filled':''}">${i<n?`<img alt="已集點" src="assets/stamp-${Number(d.stamp)||1}.png">`:i+1}</span>`).join('')}</div><div class="row"><button ${full?'disabled':''} onclick="stampChange('${x.id}',1)">＋ 集一點</button><button class="secondary" ${n===0?'disabled':''} onclick="stampChange('${x.id}',-1)">－ 扣一點</button><button ${!full?'disabled':''} onclick="redeem('${x.id}')">選擇兌換</button></div><p><small>已兌換 ${Number(d.redeemed||0)} 次</small></p><details><summary>兌換紀錄</summary>${(d.history||[]).map(h=>`<p>${esc(h.date)} · ${esc(h.reward)}${h.points?` · ${h.points} 點`: ''}</p>`).join('')||'<p>尚無紀錄</p>'}</details><button class="secondary" onclick="edit('${x.id}')">編輯</button> <button class="secondary" onclick="remove('${x.id}')">刪除</button></article>`}

async function finishWelcome(e){e.preventDefault();const f=new FormData(e.target),n=String(f.get('nickname')||'').trim(),v=validAvatar(f.get('avatar'));if(!n||!v)return alert('請輸入暱稱並選擇身分及頭貼');if(membership?.role&&v.split('-')[0]!==membership.role)return alert('配對後不可更換身分');try{if(cloud){const r=await sb.auth.updateUser({data:{tangNickname:n,tangAvatar:v}});if(r.error)throw r.error;user=r.data.user;if(room)await publishAvatar(v)}else{localStorage.setItem('tang-avatar',v);localStorage.setItem('tang-nickname',n)}go('首頁')}catch(e){err(e)}}

function showMissInbox(){if(!cloud||!user||!room||!paired||document.visibilityState==='hidden'||document.querySelector('.miss-inbox'))return;const incoming=rows('想你按鈕').filter(x=>x.data.senderId&&x.data.senderId!==user.id&&!x.data.receivedAt).sort((a,b)=>String(b.data.at||b.created_at).localeCompare(String(a.data.at||a.created_at)));if(incoming.length)openMissInbox(incoming,false)}
function openMissInbox(incoming,demo=false){if(document.querySelector('.miss-inbox'))return;const latest=incoming[0],role=latest.data.senderRole==='male'?'male':'female',overlay=document.createElement('div');overlay.className='miss-inbox';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','收到想念');overlay.innerHTML=`<section class="miss-inbox-card">${Array.from({length:12},(_,i)=>`<span class="miss-float" style="left:${(i*37)%95}%;animation-delay:${i*.23}s;font-size:${16+i%4*6}px">♡</span>`).join('')}<small>LOVE DELIVERY ♡</small><h2>${role==='male'?'老公':'老婆'}想你了！</h2><img src="${avatarSrc(role+'-1')}" alt="送出想念的小狗"><p>收到 ${incoming.length} 份想念</p><h3>${esc(latest.data.title||'想你了')}</h3><button type="button">收到你的想念了 ♡</button><p class="miss-error" aria-live="polite"></p></section>`;document.body.append(overlay);const button=overlay.querySelector('button');button.focus();button.onclick=async()=>{if(demo){overlay.remove();return}button.disabled=true;try{const stamp=new Date().toISOString();for(const x of incoming){const r=await sb.from('entries').update({data:{...x.data,receivedAt:stamp}}).eq('id',x.id).eq('room_id',room);if(r.error)throw r.error;x.data.receivedAt=stamp}overlay.remove();await refresh()}catch(e){button.disabled=false;overlay.querySelector('.miss-error').textContent='已讀同步失敗，請再試一次。'}}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloud&&room)refresh().catch(console.warn)});

const originalRender=render;render=function(){if(!cloud||!sb){gate('<p>尚未設定雲端服務，請管理者完成 Supabase 設定。</p>');return}if(!authReady){gate('<p>正在連線…</p>');return}if(!user){loginGate();return}if(!nickname()||!myAvatar()){welcome();return}if(!paired){gate(membership?.room_id?'<h2>等待另一半加入</h2><p>配對完成後即可使用共同空間。</p><button onclick="connect().catch(err)">重新確認</button><button class="secondary" onclick="logout()">登出</button>':'<h2>夫妻配對</h2><form onsubmit="event.preventDefault();pair()"><label>六位數配對碼</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button>加入共同空間</button></form><button class="secondary" onclick="logout()">登出</button>');return}document.body.classList.remove('onboarding');originalRender();polish();if(page==='遊戲轉盤')drawWheel();showMissInbox()};render();if(sb)connect().catch(e=>{gate('<p>連線失敗，請重新整理或確認資料庫設定。</p>');err(e)});if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
